name: validate-publish-deploy

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: stockdesk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: registry.corvane.example
  IMAGE: stockdesk

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified upstream
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Test application (no dependencies to install)
        run: npm test
      - name: Parse YAML
        run: |
          python -m pip install --disable-pip-version-check PyYAML==6.0.3
          python scripts/check_yaml.py
      - name: Scan source for secrets and configuration risks
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          scan-type: fs
          scan-ref: .
          scanners: secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: '1'
          cache: 'false'

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: publish
    outputs:
      image: ${{ steps.push.outputs.image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Build commit-tagged image
        run: docker build --pull -t "$REGISTRY/$IMAGE:$GITHUB_SHA" .
      - name: Scan the image before publishing
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          version: v0.70.0
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ github.sha }}
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: 'false'
          cache: 'false'
      - name: Generate CycloneDX SBOM for the scanned image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          version: v0.70.0
          scan-type: image
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ github.sha }}
          format: cyclonedx
          output: ${{ runner.temp }}/stockdesk-sbom.cdx.json
          exit-code: '0' # Inventory output; the preceding vulnerability scan is the gate.
          cache: 'false'
      - name: Push and record immutable reference
        id: push
        env:
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          export DOCKER_CONFIG="$RUNNER_TEMP/stockdesk-docker"
          mkdir -p "$DOCKER_CONFIG"
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT
          printf '%s' "$REGISTRY_TOKEN" | docker login "$REGISTRY" -u "$REGISTRY_USERNAME" --password-stdin
          ref="$REGISTRY/$IMAGE:$GITHUB_SHA"
          docker push "$ref"
          immutable=$(docker image inspect --format '{{index .RepoDigests 0}}' "$ref")
          [[ "$immutable" =~ ^registry\.corvane\.example/stockdesk@sha256:[a-f0-9]{64}$ ]]
          printf 'image=%s\n' "$immutable" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$immutable" > "$RUNNER_TEMP/stockdesk-image.txt"
      - name: Retain SBOM with the published image reference
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4, verified upstream
        with:
          name: stockdesk-sbom-${{ github.sha }}
          path: |
            ${{ runner.temp }}/stockdesk-sbom.cdx.json
            ${{ runner.temp }}/stockdesk-image.txt
          if-no-files-found: error
          retention-days: 14

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: shared-test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4
        with:
          version: v1.34.1 # Verified release; operator must check cluster version skew.
      - name: Render digest, apply only workload and service, wait for rollout
        env:
          KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG }}
          DEPLOY_IMAGE: ${{ needs.publish.outputs.image }}
        shell: bash
        run: |
          set -euo pipefail
          export KUBECONFIG="$RUNNER_TEMP/stockdesk.kubeconfig"
          trap 'rm -f "$KUBECONFIG" "$RUNNER_TEMP/rendered.yaml"' EXIT
          umask 077
          printf '%s' "$KUBECONFIG_CONTENT" > "$KUBECONFIG"
          [[ "$DEPLOY_IMAGE" =~ ^registry\.corvane\.example/stockdesk@sha256:[a-f0-9]{64}$ ]]
          placeholder='registry.corvane.example/stockdesk:REPLACE_WITH_CI_COMMIT_SHA'
          test "$(grep -Fc "$placeholder" k8s/deployment.yaml)" -eq 1
          sed "s|$placeholder|$DEPLOY_IMAGE|" k8s/deployment.yaml > "$RUNNER_TEMP/rendered.yaml"
          kubectl apply -f "$RUNNER_TEMP/rendered.yaml"
          kubectl rollout status deployment/stockdesk -n default --timeout=180s
